version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    container_name: rbay-redis
    ports:
      - '6379:6379'
      - '8001:8001'
    environment:
      - REDIS_ARGS=--save 60 1
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
